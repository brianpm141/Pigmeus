services:
  db:
    image: postgres:15-alpine
    container_name: pigmeus_db_server
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1234
      POSTGRES_DB: pigmeus_db
      # ESTO ES IMPORTANTE: Permite conexiones con contraseña desde cualquier IP
      POSTGRES_HOST_AUTH_METHOD: md5 
    ports:
      - "5432:5432"
    volumes:
      - ./pg_data:/var/lib/postgresql/data